name: ProductPulse

on:
  push:
    paths:
      - 'productpulse/**'
      - '.github/workflows/productpulse.yml'
  pull_request:
    paths:
      - 'productpulse/**'
      - '.github/workflows/productpulse.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run ProductPulse tests
        run: bash productpulse/scripts/run_tests.sh
