services:
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb -p local/warehouse || true; exit 0;"

  hive-metastore:
    image: apache/hive:4.0.1
    environment:
      SERVICE_NAME: metastore
    ports: ['9083:9083']
    volumes:
      - hive-data:/opt/hive/data

  trino:
    image: trinodb/trino:477
    depends_on: [minio-init, hive-metastore]
    ports: ['8080:8080']
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro

  airflow:
    image: apache/airflow:2.10.5-python3.11
    depends_on: [trino]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      _PIP_ADDITIONAL_REQUIREMENTS: 'trino==0.330.0 dbt-trino==1.9.3'
    command: standalone
    ports: ['8088:8080']
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./:/opt/airflow/project:ro
      - productpulse-data:/opt/airflow/data

volumes:
  hive-data:
  productpulse-data:
